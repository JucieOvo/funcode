[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funcode"
version = "0.1.0"
description = "Funcode 的 Python + LangChain + LangGraph 实现"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "JucieOvo" }
]
dependencies = [
  "langchain==1.0.8",
  "langgraph==1.0.1",
  "langchain-openai>=0.3.0,<0.4.0",
  "pydantic>=2.11.0,<3.0.0",
  "typing-extensions>=4.12.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.12.0,<0.13.0",
]

[project.scripts]
funcode = "funcode.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
